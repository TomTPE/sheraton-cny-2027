# 測試環境：推送到 main 時，建置前台並部署到 GitHub Pages。
# 注意：GitHub Pages 網站預設對網際網路公開（僅 GitHub Enterprise Cloud 提供存取控制的私有 Pages）。
# 各 action 以 commit SHA 固定版本（防止標籤被竄改），註解為對應正式版。
# 2026-10-24 查證：以下版本皆以 Node.js 24 執行（Node.js 20 已停用）；升級時請一併更新 SHA 與註解。
name: Deploy test site to GitHub Pages

on:
  push:
    branches: [main]
    # cms/draft.json（草稿）不在清單內：儲存草稿不會觸發部署，只有「發布」（改寫 data/content.json）才會上線
    paths: ["index.html", "assets/**", "data/content.json", "admin/**", "scripts/**", "server.py", "deploy/cloud-run/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 驗證 content.json（與後台相同規則：CTA、電話、網址、色票、追蹤碼格式）
        run: |
          python3 -I -c "import sys, json; sys.path.insert(0, '.'); import server; e = server.validate_document(json.load(open('data/content.json', encoding='utf-8'))); [print('::error::' + x['path'] + '：' + x['message']) for x in e]; sys.exit(1 if e else 0)"
      - name: 建置（測試環境，強制 noindex、移除校稿欄位、寫入 SEO 標籤，並部署雲端後台）
        # CMS_API（儲存庫變數）設定後，後台改用 Cloudflare Worker 帳號密碼登入；未設定時沿用 GitHub 金鑰登入
        env:
          CMS_API: ${{ vars.CMS_API }}
        run: python3 scripts/build.py --env test --out dist --with-admin --repo "${{ github.repository }}" --branch main
      - name: 檢查建置產物（無內部欄位、引用檔案皆存在、色票、SEO、後台 CSP）
        run: python3 scripts/check_dist.py dist --allow-admin
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0（內含 upload-artifact v7.0.0）
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # GCP Cloud Run：與 GitHub Pages 同步部署。以 Workload Identity Federation 免金鑰登入（只信任本儲存庫 main 分支）。
  # 需先執行 deploy/gcp/setup-github-deploy.sh 設定儲存庫變數；未設定時自動略過。
  # 不帶 --allow-unauthenticated／--no-allow-unauthenticated，沿用服務既有的存取設定。
  deploy-gcp:
    needs: build
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 建置 Cloud Run 版本（與 Pages 相同內容，含後台）
        env:
          CMS_API: ${{ vars.CMS_API }}
        run: |
          python3 scripts/build.py --env test --out deploy/cloud-run/public --with-admin --repo "${{ github.repository }}" --branch main
          python3 scripts/check_dist.py deploy/cloud-run/public --allow-admin
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: 部署到 Cloud Run（asia-east1）
        run: gcloud run deploy sheraton-cny-web --source deploy/cloud-run --project "${{ vars.GCP_PROJECT }}" --region asia-east1 --port 8080 --memory 256Mi --max-instances 5 --quiet
