# 共用安全標頭（每個 location 都 include，避免 nginx add_header 不繼承的問題）
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy $csp always;
# 目前為預覽階段（content.json meta.noindex = true）：不收錄。
# 正式開放搜尋引擎時，改成只留 "noai, noimageai"，並同步修改 robots.txt。
add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
