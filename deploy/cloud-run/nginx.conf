# 安全標頭：GitHub Pages 無法設定，這裡補齊（見 docs/上線準備清單.md 第 4 節）
map $uri $csp {
  default "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://sheraton-cny-cms.sheraton-cny-cms-worker.workers.dev https://*.google-analytics.com https://www.googletagmanager.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'";
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy $csp always;

  # 內容資料與首頁不快取太久；JS／CSS 有內容雜湊可長快取
  location = /index.html { add_header Cache-Control "no-cache" always; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options "nosniff" always; add_header Content-Security-Policy $csp always; add_header X-Frame-Options "SAMEORIGIN" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; }
  location = /data/content.json { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
  location /assets/ { expires 7d; add_header Cache-Control "public" always; add_header X-Content-Type-Options "nosniff" always; }
  location /admin/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/ =404;
  }
  location / { try_files $uri $uri/ =404; }
}
