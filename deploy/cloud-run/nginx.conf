# 台北喜來登 2027 新春網站｜Cloud Run 靜態主機（nginx 1.30.6-alpine）
# 安全標頭與防爬設定（對應 cny-2027-v3/資安防護確認表_防爬蟲.md）：
#   限流（每個來源 IP）、只允許 GET／HEAD、擋 AI 蒐集爬蟲與抓站工具、圖片防盜連、
#   隱藏檔與原始碼一律 404、安全標頭（security-headers.conf）。
# Cloud Run 前面是 Google Frontend，真實來源 IP 取 X-Forwarded-For 第一段。

map $http_x_forwarded_for $client_ip {
  default $remote_addr;
  "~^(?<first>[^,\s]+)" $first;
}
limit_req_zone  $client_ip zone=perip:10m rate=10r/s;
limit_conn_zone $client_ip zone=perconn:10m;

map $http_user_agent $bad_bot {
  default 0;
  "~*(GPTBot|ChatGPT-User|OAI-SearchBot|CCBot|ClaudeBot|Claude-Web|anthropic-ai|Bytespider|PerplexityBot|Amazonbot|Applebot-Extended|meta-externalagent|FacebookBot|Diffbot|ImagesiftBot|Omgilibot|cohere-ai|YouBot|DataForSeoBot|PetalBot|SemrushBot|AhrefsBot|MJ12bot|DotBot)" 1;
  "~*(python-requests|python-urllib|aiohttp|httpx|scrapy|HTTrack|wget|Go-http-client|okhttp|libwww-perl|curl-impersonate|node-fetch|axios|headless|phantomjs|selenium|puppeteer|playwright)" 1;
  "" 1;
}

map $uri $csp {
  default "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://sheraton-cny-cms.sheraton-cny-cms-worker.workers.dev https://*.google-analytics.com https://www.googletagmanager.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'; object-src 'none'";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  autoindex off;
  client_max_body_size 1k;

  limit_req zone=perip burst=40 nodelay;
  limit_conn perconn 20;
  limit_req_status 429;
  limit_conn_status 429;

  include /etc/nginx/snippets/security-headers.conf;

  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  set $deny $bad_bot;
  if ($uri = /robots.txt) { set $deny 0; }
  if ($deny) { return 403; }

  # 隱藏檔、原始碼與其他資料檔一律 404；只開放 data/content.json（前台讀取用）
  location ~ /\. { return 404; }
  location = /data/content.json { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; }
  location ~* \.(py|sh|bak|map|json|md|toml|yml|yaml|sql|log|env|ini|conf|zip|tar|gz)$ { return 404; }

  location = /robots.txt  { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=3600" always; }
  location = /sitemap.xml { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=3600" always; }
  location = /index.html  { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; }

  # 圖片防盜連：只允許本站、官網與直接開啟（社群分享預覽沒有 Referer，仍可讀取）
  location ~* ^/assets/(img|uploads|fake)/ {
    valid_referers none blocked server_names ~\.run\.app ~sheratongrandtaipei\.com ~tomtpe\.github\.io;
    if ($invalid_referer) { return 403; }
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
  }
  # JS／CSS 有內容雜湊，可長快取
  location /assets/ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=604800" always; }

  location /admin/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ =404;
  }
  location / { try_files $uri $uri/ =404; }
}
